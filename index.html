<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RAGE BALL" />
  <title>RAGE BALL</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0d0d1a;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    #pre-load {
      position: fixed; inset: 0;
      background: #0d0d1a;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 9999;
      font-family: 'Press Start 2P', monospace;
      transition: opacity 0.5s ease;
    }
    #pre-load.fade-out { opacity: 0; pointer-events: none; }
    #pre-load h1 {
      font-size: clamp(24px, 5vw, 52px);
      color: #ff4444;
      text-shadow: 0 0 20px #ff4444, 0 0 40px #ff0000;
      animation: ragePulse 1s ease-in-out infinite alternate;
      letter-spacing: 4px;
    }
    #pre-load p {
      margin-top: 16px;
      font-size: clamp(8px, 1.5vw, 12px);
      color: #666;
    }
    @keyframes ragePulse {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div id="pre-load">
    <h1>RAGE BALL</h1>
    <p>Preparing your suffering...</p>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/GameRage/sw.js').catch(() => {});
      });
    }
    window.__RAGE_READY = false;
    window.addEventListener('RAGE_GAME_READY', () => {
      const pre = document.getElementById('pre-load');
      pre.classList.add('fade-out');
      setTimeout(() => pre.remove(), 600);
    });
  </script>
</body>
</html>
