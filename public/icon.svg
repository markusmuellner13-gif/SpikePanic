<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="ball" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff8844"/>
      <stop offset="60%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#cc2200"/>
    </radialGradient>
    <radialGradient id="sheen" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Glow ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ff4444" stroke-width="4" opacity="0.4" filter="url(#glow)"/>
  <!-- Ball -->
  <circle cx="256" cy="256" r="175" fill="url(#ball)" filter="url(#glow)"/>
  <!-- Sheen -->
  <circle cx="256" cy="256" r="175" fill="url(#sheen)"/>
  <!-- Left eye -->
  <ellipse cx="210" cy="220" rx="28" ry="30" fill="#111"/>
  <circle cx="218" cy="212" r="8" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="302" cy="220" rx="28" ry="30" fill="#111"/>
  <circle cx="310" cy="212" r="8" fill="white"/>
  <!-- Angry left brow -->
  <rect x="182" y="178" width="60" height="14" rx="7" fill="#111" transform="rotate(20,212,185)"/>
  <!-- Angry right brow -->
  <rect x="270" y="178" width="60" height="14" rx="7" fill="#111" transform="rotate(-20,300,185)"/>
  <!-- Frown mouth -->
  <path d="M200 310 Q256 275 312 310" stroke="#111" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Rage veins -->
  <path d="M155 160 L140 140 L160 155" stroke="#ff2200" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M357 160 L372 140 L352 155" stroke="#ff2200" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
